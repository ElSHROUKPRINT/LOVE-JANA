<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جني ✦ دنيتي</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/extra.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <clipPath id="almond" clipPathUnits="objectBoundingBox"><path d="M0,.5 Q.5,-.2 1,.5 Q.5,1.2 0,.5Z"/></clipPath>
 <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
</svg>
<canvas id="fx"></canvas>
<audio id="song" loop preload="auto"></audio>
<button id="mute" aria-label="الموسيقى">♪</button>

<div id="gate">
  <div>
    <div class="env" id="env">
      <div class="back"></div>
      <div class="card">إلى جني ♥</div>
      <div class="front"></div>
      <div class="flap"></div>
      <button class="seal" id="enter" aria-label="افتحي الظرف">جني</button>
    </div>
    <p>اضغطي على الختم ✦</p>
  </div>
</div>

<div id="reel"><button id="reelx">✕ رجوع</button></div>

<section id="hero">
  <svg class="cat" id="cat" viewBox="0 0 260 300" aria-label="قطة بتلعب">
   <g class="sw">
    <g stroke="#f0a35e" stroke-width="13" stroke-linecap="round" fill="none"><path d="M78 118 Q66 60 82 4"/><path d="M122 118 Q134 60 118 4"/></g>
    <ellipse cx="82" cy="6" rx="11" ry="9" fill="#ffd9b0"/><ellipse cx="118" cy="6" rx="11" ry="9" fill="#ffd9b0"/>
    <path class="tail" d="M128 190 Q190 205 176 140" stroke="#f0a35e" stroke-width="13" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="160" rx="36" ry="50" fill="#f0a35e"/><ellipse cx="100" cy="168" rx="22" ry="34" fill="#ffe6c9"/>
    <ellipse cx="84" cy="208" rx="13" ry="9" fill="#ffd9b0"/><ellipse class="paw" cx="118" cy="208" rx="13" ry="9" fill="#ffd9b0"/>
    <circle cx="100" cy="100" r="36" fill="#f0a35e"/>
    <path d="M70 80 L66 52 L90 68Z M130 80 L134 52 L110 68Z" fill="#f0a35e"/><path d="M72 74 L71 60 L83 68Z M128 74 L129 60 L117 68Z" fill="#ff9db0"/>
    <ellipse cx="86" cy="98" rx="5" ry="7" fill="#2a1840"/><ellipse cx="114" cy="98" rx="5" ry="7" fill="#2a1840"/><circle cx="88" cy="95" r="2" fill="#fff"/><circle cx="116" cy="95" r="2" fill="#fff"/>
    <path d="M96 110 L104 110 L100 115Z" fill="#ff7a93"/><path d="M100 115 Q94 122 90 118 M100 115 Q106 122 110 118" stroke="#6b3b2a" fill="none" stroke-width="2" stroke-linecap="round"/>
    <path d="M70 108 H50 M70 114 L52 122 M130 108 H150 M130 114 L148 122" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/>
    <ellipse cx="72" cy="112" rx="7" ry="4" fill="#ff9db0" opacity=".5"/><ellipse cx="128" cy="112" rx="7" ry="4" fill="#ff9db0" opacity=".5"/>
   </g>
   <g class="ball"><path d="M200 0 V150" stroke="#ffd9b0" stroke-width="2"/><circle cx="200" cy="172" r="24" fill="#ff8fa3"/><path d="M180 160 Q200 150 220 164 M178 176 Q200 166 222 180 M184 190 Q202 182 218 192" stroke="#ffe3ea" stroke-width="2.4" fill="none"/></g>
  </svg>
  <h1>جني</h1>
  <p class="sub ruq" id="typed"></p>
  <div class="down">⌄</div>
</section>

<div class="lyr"></div>

<section>
  <h2>أول حاجة وقعت فيها</h2>
  <div class="eyewrap">
    <div class="eye" id="eye" role="button" tabindex="0" aria-label="افتحي الذكريات">
      <img id="eyeimg" alt="" onerror="this.style.opacity=0">
      <i class="lid t"></i><i class="lid b"></i>
    </div>
    <small>اضغطي على العين... ادخلي جواها ✦</small>
  </div>
</section>

<section>
  <h2>ورقة قديمة... ليكي</h2>
  <div class="scr" id="scr"><i class="roll"></i><div class="sheet"><div class="in"><span id="letter"></span></div></div><i class="roll"></i></div>
</section>

<div class="lyr"></div>

<section>
  <h2>ستوريز حكايتنا</h2>
  <div class="rings" id="rings"></div>
</section>

<section>
  <h2>صورنا</h2>
  <div class="board" id="board"></div>
</section>

<div class="lyr"></div>

<section>
  <svg class="pet puppy" viewBox="0 0 120 110" aria-label="كلب صغير"><g class="bob"><ellipse cx="22" cy="58" rx="16" ry="30" fill="#8b5a3c" transform="rotate(12 22 58)"/><ellipse cx="98" cy="58" rx="16" ry="30" fill="#8b5a3c" transform="rotate(-12 98 58)"/><circle cx="60" cy="58" r="40" fill="#f3d3a8"/><ellipse cx="60" cy="74" rx="22" ry="17" fill="#fff3df"/><circle cx="44" cy="52" r="5.5" fill="#2a1840"/><circle cx="76" cy="52" r="5.5" fill="#2a1840"/><circle cx="46" cy="50" r="2" fill="#fff"/><circle cx="78" cy="50" r="2" fill="#fff"/><ellipse cx="60" cy="66" rx="7" ry="5" fill="#3a2428"/><path d="M60 70 v5 M51 76 Q60 86 69 76" stroke="#3a2428" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse class="tg" cx="60" cy="82" rx="5" ry="6" fill="#ff7a93"/><ellipse cx="34" cy="66" rx="7" ry="4" fill="#ff9db0" opacity=".5"/><ellipse cx="86" cy="66" rx="7" ry="4" fill="#ff9db0" opacity=".5"/></g><ellipse cx="36" cy="104" rx="14" ry="8" fill="#fff3df"/><ellipse cx="84" cy="104" rx="14" ry="8" fill="#fff3df"/></svg>
  <h2>عندي ليكي أسئلة</h2>
  <div id="qs"></div>
</section>

<section>
  <h2>نفسك في إيه؟</h2>
  <div class="chips" id="chips"></div>
  <textarea id="wish" placeholder="اكتبي أي حاجة نفسك فيها... أنا هنفذها لو قدرت ✦"></textarea>
  <div class="center"><button class="b" id="send">ابعتيها لي 💌</button></div>
</section>

<footer>
  <svg class="pet pony" viewBox="0 0 120 140" aria-label="حصان صغير"><g class="bob"><path d="M30 40 Q8 72 22 116 Q36 94 38 62Z M90 40 Q112 72 98 116 Q84 94 82 62Z" fill="#ff8fa3"/><path d="M40 22 L34 -4 L58 14Z M80 22 L86 -4 L62 14Z" fill="#f7e4d0"/><ellipse cx="60" cy="74" rx="31" ry="44" fill="#f7e4d0"/><path d="M32 40 Q60 -10 88 40 Q60 22 32 40Z" fill="#ff8fa3"/><ellipse cx="60" cy="108" rx="22" ry="16" fill="#ffd9c7"/><ellipse cx="47" cy="72" rx="6" ry="8" fill="#2a1840"/><ellipse cx="73" cy="72" rx="6" ry="8" fill="#2a1840"/><circle cx="49" cy="69" r="2.2" fill="#fff"/><circle cx="75" cy="69" r="2.2" fill="#fff"/><ellipse cx="52" cy="108" rx="2.6" ry="3.6" fill="#c98a7a"/><ellipse cx="68" cy="108" rx="2.6" ry="3.6" fill="#c98a7a"/><path d="M52 118 Q60 124 68 118" stroke="#a5645a" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="36" cy="92" rx="7" ry="4" fill="#ff9db0" opacity=".55"/><ellipse cx="84" cy="92" rx="7" ry="4" fill="#ff9db0" opacity=".55"/></g></svg>
  <div class="big">بحبك يا جني</div>
  <p class="ruq" style="font-size:1.6rem;margin-top:1rem;color:var(--gold)">وهفضل أحبك أكتر كل يوم</p>
  <p id="secret" class="ruq">♥</p>
</footer>

<div id="story"><div class="sbox"><div class="bars"></div><div class="shead"><span class="av">♥</span><div><b>جني ♥ دنيتي</b><small>دلوقتي</small></div><button id="sx" aria-label="إغلاق">✕</button></div><div class="fr"></div><div class="tap n"></div><div class="tap p"></div><div class="scap"></div><form class="rep" id="srep"><input type="text" placeholder="ابعتي رد..."><button aria-label="إرسال">➤</button></form></div></div>

<script src="data/data.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
